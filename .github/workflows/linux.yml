name: Companion checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.2'
          cache: true
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Release mode (secrets all-or-none, early only with none)
        run: sh scripts/test-release-mode.sh
      - name: Vet
        run: go vet ./...
      - name: Race tests
        run: go test -race ./...
      - name: Build
        run: go build ./...
      - name: Darwin cross-build and Mach-O checks (not runtime tests)
        run: sh scripts/build-macos.sh
      - name: Compile Darwin tests without executing them
        shell: bash
        run: |
          set -euo pipefail
          for arch in arm64 amd64; do
            while read -r pkg; do
              CGO_ENABLED=0 GOOS=darwin GOARCH="$arch" go test -c "$pkg" -o /tmp/companion-darwin.test
            done < <(CGO_ENABLED=0 GOOS=darwin GOARCH="$arch" go list ./...)
          done
