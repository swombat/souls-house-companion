name: Companion checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.2'
          cache: true
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Release mode (secrets all-or-none, early only with none)
        run: sh scripts/test-release-mode.sh
      - name: Vet
        run: go vet ./...
      - name: Race tests
        run: go test -race ./...
      - name: Build
        run: go build ./...
      - name: Linux release tarballs (ELF arch checks)
        run: sh scripts/build-linux.sh
      - name: Darwin cross-build and Mach-O checks (not runtime tests)
        run: sh scripts/build-macos.sh
      - name: Compile Darwin tests without executing them
        shell: bash
        run: |
          set -euo pipefail
          for arch in arm64 amd64; do
            while read -r pkg; do
              CGO_ENABLED=0 GOOS=darwin GOARCH="$arch" go test -c "$pkg" -o /tmp/companion-darwin.test
            done < <(CGO_ENABLED=0 GOOS=darwin GOARCH="$arch" go list ./...)
          done

  menubar:
    # The menu bar app and its MenuCore tests only build on macOS. Until this
    # job they were never run by CI. Also runs the darwin-only client test for
    # the run-commands opt-in report.
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.2'
          cache: true
      - name: MenuCore tests
        run: cd menubar && swift test
      - name: Menu app builds
        run: cd menubar && swift build -c release
      - name: The app bundle carries a working companion (scripts/build-menubar.sh)
        shell: bash
        run: |
          set -euo pipefail
          sh scripts/build-macos.sh dist
          sh scripts/build-menubar.sh dist dist/companion-darwin-arm64 ci-check
          app=dist/souls.house.app
          codesign --verify --strict --deep "$app"
          [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Contents/Info.plist")" = ci-check ]
          [ "$("$app/Contents/MacOS/souls-house-companion" version)" = "$(dist/companion-darwin-arm64 version)" ]
      - name: Darwin client tests (run, not just compiled)
        run: go test ./internal/client/
